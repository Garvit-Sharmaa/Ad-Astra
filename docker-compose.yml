services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3005:3005"
    env_file:
      - ./server/.env
    environment:
      - PORT=3005
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost:5173
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - ad_astra_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_BACKEND_URL=http://localhost:3005
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - ad_astra_network

networks:
  ad_astra_network:
    driver: bridge
